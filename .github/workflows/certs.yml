name: List signing certificates

# Read-only. Automatic signing mints a fresh Apple Development certificate on
# every CI run, and Apple caps how many an account may hold at once — when the
# cap is hit, archiving fails with "Choose a certificate to revoke". This lists
# what the account is holding so the right ones can be revoked by hand.
on:
  workflow_dispatch:
    inputs:
      revoke_ci_certificates:
        description: >-
          Revoke every DEVELOPMENT certificate named "Created via API".
          These are the ones CI minted; certificates named after a person
          belong to a real Mac and are never touched.
        type: boolean
        default: false

jobs:
  list:
    runs-on: macos-26
    steps:
      - name: Ask App Store Connect what certificates exist
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          REVOKE: ${{ inputs.revoke_ci_certificates }}
        run: |
          node - <<'NODE'
          import crypto from 'node:crypto';

          // ES256 JWT, per Apple's "Generating Tokens for API Requests".
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = b64({ alg: 'ES256', kid: process.env.KEY_ID, typ: 'JWT' });
          const payload = b64({
            iss: process.env.ISSUER_ID,
            iat: now,
            exp: now + 300,
            aud: 'appstoreconnect-v1',
          });
          const signer = crypto.createSign('SHA256');
          signer.update(`${header}.${payload}`);
          const signature = signer.sign(
            { key: process.env.KEY_P8, dsaEncoding: 'ieee-p1363' }
          ).toString('base64url');
          const token = `${header}.${payload}.${signature}`;

          const call = async (path, method = 'GET') => {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              method,
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!response.ok) {
              console.log(`${method} ${path}: HTTP ${response.status} ${await response.text()}`);
              process.exit(1);
            }
            return response.status === 204 ? null : response.json();
          };

          const { data } = await call('/v1/certificates?limit=200');
          const byType = {};
          for (const cert of data) {
            const { certificateType: type, displayName, expirationDate } = cert.attributes;
            (byType[type] ||= []).push(`  ${expirationDate?.slice(0, 10)}  ${displayName}`);
          }
          console.log(`${data.length} certificate(s) on the account\n`);
          for (const [type, rows] of Object.entries(byType)) {
            console.log(`${type}  (${rows.length})`);
            console.log(rows.sort().join('\n'));
            console.log('');
          }

          if (process.env.REVOKE !== 'true') process.exit(0);

          // Only the ones CI made. A certificate named after a person is
          // installed on a real Mac, and revoking it breaks signing there.
          const disposable = data.filter(
            (cert) =>
              cert.attributes.certificateType === 'DEVELOPMENT' &&
              cert.attributes.displayName === 'Created via API'
          );
          console.log(`revoking ${disposable.length} CI certificate(s)`);
          for (const cert of disposable) {
            await call(`/v1/certificates/${cert.id}`, 'DELETE');
            console.log(`  revoked ${cert.id}  ${cert.attributes.expirationDate?.slice(0, 10)}`);
          }
          NODE
