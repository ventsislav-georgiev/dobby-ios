name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:
  # #183: a PWA-only change on dobby main has no dobby-ios push to ride, so TestFlight
  # drifted behind the PWA. Hourly, the decide job below builds when the pair (this
  # dobby-ios commit, PWA main) has no TestFlight build yet. Minute 17: off the
  # top-of-hour rush that delays scheduled runs.
  # RISK: GitHub disables a public repository's scheduled workflows after 60 days with
  # no repository activity, which is exactly the quiet-dobby-ios case this exists for.
  # Any push re-arms it; so does re-enabling the workflow from the Actions tab.
  schedule:
    - cron: '17 * * * *'

# Workflow-level on purpose, not on the release job: decide has to run AFTER the build
# ahead of it has uploaded its record, or every tick during a build finds no record for
# the pair being built and queues a duplicate. The one pending slot means a tick can
# replace a pending push run; the tick then builds main as of its own trigger, which
# already contains that push, and the pair key below makes it build rather than skip.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  # #183: the skip/build decision, on a cheap runner, before any macOS minute is spent.
  # Records are artifacts the release job uploads, named for the pair it actually built:
  # testflight-<dobby-ios sha>-<PWA sha> after a successful TestFlight upload (90 days),
  # testflight-failed-<dobby-ios sha>-<PWA sha> when the job fails (1 day, so a broken
  # pair retries once a day instead of every hour). Looked up by exact name. Only a
  # schedule run reads the APIs at all: a push or dispatch always builds, so no transient
  # API error can ever skip one. Known edge: force-resetting both mains to a pair built
  # earlier (A to B to A) skips, though TestFlight carries B; a revert is a new sha.
  decide:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      pwa_sha: ${{ steps.decide.outputs.pwa_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Decide whether this run builds
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PWA_TOKEN: ${{ secrets.DOBBY_PWA_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            scripts/testflight-decide.sh "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pwa_sha=$(GH_TOKEN="$PWA_TOKEN" gh api repos/ventsislav-georgiev/bookplay/commits/main --jq .sha)
          pair="$GITHUB_SHA-$pwa_sha"
          live() { gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1" --jq '[.artifacts[] | select(.expired | not)] | length'; }
          built=$(live "testflight-$pair")
          failed=$(live "testflight-failed-$pair")
          scripts/testflight-decide.sh "$GITHUB_EVENT_NAME" "$GITHUB_SHA" "$pwa_sha" "$built" "$failed" >> "$GITHUB_OUTPUT"

  release:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: macos-26
    env:
      TEAM_ID: V5XV3994L8
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    # Every existing `run:` step below assumed it started in the checkout root;
    # giving dobby-ios its own path (#155, next) moves that root, so this keeps
    # every one of them working unchanged instead of prefixing each with cd.
    defaults:
      run:
        working-directory: dobby-ios
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: dobby-ios

      # #155: scripts/copy-app-shell.sh (invoked as a preBuildScript below) bundles
      # the PWA app shell for the Pi-less cold start (#151) by reading a SIBLING
      # dobby checkout at ../dobby — the same arrangement dobby-android's
      # copyAppShell depends on. A single-repo checkout, which is all this workflow
      # had before, can never have that sibling, so every TestFlight build shipped
      # without the shell: the script warns and exits 0 (it must — dobby-ios-only
      # changes with no PWA checkout still have to build), and the archive silently
      # got an empty Dobby/Shell. This checkout gives it one, landing dobby and
      # dobby-ios as true siblings under $GITHUB_WORKSPACE — the layout
      # copy-app-shell.sh's default path already expects, no script changes needed.
      #
      # The default GITHUB_TOKEN is scoped to this repository alone and cannot
      # reach the PWA repository, so this step needs its own credential: a
      # fine-grained PAT, read-only, contents scope, narrowed to that one
      # repository, stored as the DOBBY_PWA_CHECKOUT_TOKEN secret. Unlike copy-app-shell.sh's own leniency, this
      # step's failure is NOT swallowed — this workflow's whole job is the artifact
      # that ships, so a missing shell here is the regression #155 exists to close,
      # not an unrelated build's problem. See "Verify the app shell was bundled"
      # below for the other half of that guard.
      - name: Check out dobby (PWA app shell source)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ventsislav-georgiev/bookplay
          token: ${{ secrets.DOBBY_PWA_CHECKOUT_TOKEN }}
          # #183: NO ref: here. A sha ref detaches the checkout, and a detached checkout
          # prints "HEAD is now at <sha> <subject>" - a private commit subject in this
          # public log. Nor is a pin needed: if PWA main moves after decide, this builds
          # and records the newer commit, which is the right outcome.
          path: dobby

      # #167: copy-app-shell.sh's manifest entry /playsvideo/assets/bundle.js
      # resolves against dobby/Sources/BookPlayServer/Public/playsvideo/assets,
      # which is gitignored in the PWA repo — it's build output that only
      # exists in a working tree that has actually built it, so the checkout
      # above never has it. The playsvideo repo now publishes that directory
      # as a release asset instead; this step fetches it. Must run before
      # Archive (the step that invokes copy-app-shell.sh as a preBuildScript):
      # after Archive the download is useless, the missing directory would
      # already have failed the build.
      #
      # This job's defaults.run.working-directory is dobby-ios (see the
      # comment above the first checkout step), so a bare relative path here
      # would land inside that checkout instead of the PWA one. working-
      # directory: . overrides the job default for this one step, resolving
      # relative paths against $GITHUB_WORKSPACE instead — the same root the
      # "path: dobby" checkout above used — so "dobby/..." below means the
      # PWA checkout, not dobby-ios/dobby.
      #
      # bundle-latest is a rolling tag on the playsvideo side; pinning it
      # here (rather than an unqualified "latest release") matters because
      # that repo also cuts plain version-tag releases that carry no bundle
      # asset at all, so "newest release" is not the same as "newest bundle".
      - name: Fetch playsvideo bundle asset
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dest="dobby/Sources/BookPlayServer/Public/playsvideo/assets"
          mkdir -p "$dest"
          gh release download bundle-latest \
            --repo ventsislav-georgiev/playsvideo \
            --pattern playsvideo-bundle.tar.gz \
            --output playsvideo-bundle.tar.gz \
            --clobber
          tar xzf playsvideo-bundle.tar.gz -C "$dest"
          rm -f playsvideo-bundle.tar.gz

          # Fail loudly here rather than let a missing/extra bundle file
          # surface as an opaque Python traceback three steps later in
          # copy-app-shell.sh (which is exactly how #167 was first found).
          # No mapfile/readarray here: this job runs on macOS, whose /bin/bash
          # is 3.2 and has neither, and which bash a runner step actually gets
          # is not something this repo can verify from here. find + wc works
          # on every bash.
          bundles=$(find "$dest" -maxdepth 1 -name 'bundle-*.js' | sort)
          bundle_count=$(printf '%s' "$bundles" | grep -c . || true)
          if [ "$bundle_count" -ne 1 ]; then
            echo "::error::expected exactly one $dest/bundle-*.js after extracting the playsvideo bundle-latest release, found $bundle_count: $(printf '%s' "$bundles" | tr '\n' ' ')" >&2
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Resolve SPM packages first, then strip the illegal underscore from
      # FFmpegKit's libshaderc_combined CFBundleIdentifier. Must happen BEFORE
      # archive: ProcessXCFramework extracts the slice early in the build, so a
      # preBuild script fixes it too late (embed copies the unfixed extract).
      - name: Resolve packages and fix framework bundle ids
        run: |
          xcodebuild -project Dobby.xcodeproj -scheme Dobby \
            -derivedDataPath "$RUNNER_TEMP/DD" -resolvePackageDependencies
          find "$RUNNER_TEMP/DD/SourcePackages/checkouts/FFmpegKit" \
            -name Info.plist -path '*.framework/*' | while IFS= read -r p; do
            id="$(plutil -extract CFBundleIdentifier raw "$p" 2>/dev/null)" || continue
            case "$id" in *_*)
              chmod u+w "$(dirname "$p")" "$p"
              plutil -replace CFBundleIdentifier -string "${id//_/-}" "$p" && echo "fixed $id";;
            esac
          done

      - name: Write App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Import distribution certificate
        env:
          CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Archive
        run: |
          xcodebuild archive \
            -project Dobby.xcodeproj -scheme Dobby -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            -archivePath build/Dobby.xcarchive \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$(date +%Y%m%d%H%M)" \
            -allowProvisioningUpdates

      # #155: the other half of the checkout guard above. A shell that failed to
      # bundle for ANY reason — the checkout step above, a drifted sibling, a
      # project.yml change to how Shell is wired — must not reach TestFlight
      # silently; it already reached this point once with no failure anywhere.
      - name: Verify the app shell was bundled
        run: |
          shell_html="build/Dobby.xcarchive/Products/Applications/Dobby.app/Shell/index.html"
          if [ ! -s "$shell_html" ]; then
            echo "::error::No app shell in this archive ($shell_html missing or empty)." \
                 "The Pi-less cold start (#151) will not work on this build." \
                 "Check the 'Check out dobby (PWA app shell source)' step and the" \
                 "DOBBY_PWA_CHECKOUT_TOKEN secret." >&2
            exit 1
          fi
          # #183: the record uploaded after TestFlight is read out of the archive, so
          # the archive has to name the commit whose bytes it carries: the one the PWA
          # checkout actually landed on, not the one decide saw.
          bundled_sha=$(cat build/Dobby.xcarchive/Products/Applications/Dobby.app/Shell/pwa-commit.txt 2>/dev/null || true)
          checked_out=$(git -C ../dobby rev-parse HEAD)
          if [ "$bundled_sha" != "$checked_out" ]; then
            echo "::error::The archive's Shell/pwa-commit.txt says '$bundled_sha', the PWA checkout is $checked_out." >&2
            exit 1
          fi
          echo "bundled PWA commit $bundled_sha, shell stamp: $(grep -o 'app-version[^<]*' "$shell_html" | head -1)"

      - name: Export .ipa
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Dobby.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(ls build/export/*.ipa | head -1)" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # #183: after the upload and only on its success, the record the decide job looks
      # up on the next scheduled run: the pair this build actually carried, dobby-ios
      # from this checkout and PWA from the archive, not from the decision.
      - name: Record the pair this build shipped
        id: record
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwa-record"
          cp build/Dobby.xcarchive/Products/Applications/Dobby.app/Shell/pwa-commit.txt "$RUNNER_TEMP/pwa-record/"
          echo "name=testflight-$(git rev-parse HEAD)-$(cat "$RUNNER_TEMP/pwa-record/pwa-commit.txt")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.record.outputs.name }}
          path: ${{ runner.temp }}/pwa-record/pwa-commit.txt
          retention-days: 90

      # Automatic signing mints a fresh Apple Development certificate for this
      # runner, which is gone the moment the job ends — but the account keeps
      # the record, and once enough pile up archiving fails outright with
      # "Choose a certificate to revoke". Hand it back. Runs even on failure:
      # a run that dies after the archive still minted one. Certificates named
      # after a person live on a real Mac and are left alone.
      - name: Revoke this run's certificate
        if: always()
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          REVOKE: true
        run: node scripts/asc-certs.mjs

      # #183: a failed pair is marked for one day, so a deterministic failure (a PWA
      # commit the shell guard rejects, an expired token) retries once a day on schedule
      # instead of 24 times, each minting and revoking a certificate. Push and dispatch
      # ignore the marker. PWA sha from the checkout when it got that far, else decide's.
      - name: Mark this pair failed
        id: failed
        if: failure()
        env:
          DECIDED_PWA_SHA: ${{ needs.decide.outputs.pwa_sha }}
        run: |
          pwa=$(git -C ../dobby rev-parse HEAD 2>/dev/null || true)
          pwa=${pwa:-$DECIDED_PWA_SHA}
          if [ -z "$pwa" ]; then echo "no PWA commit known; no failure marker"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/pwa-failed"
          echo "$pwa" > "$RUNNER_TEMP/pwa-failed/pwa-commit.txt"
          echo "name=testflight-failed-$(git rev-parse HEAD)-$pwa" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.failed.outputs.name != ''
        with:
          name: ${{ steps.failed.outputs.name }}
          path: ${{ runner.temp }}/pwa-failed/pwa-commit.txt
          retention-days: 1
