name: Dobby
options:
  bundleIdPrefix: eu.illegible
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    # Pinned to a revision, not a branch: Dobby.xcodeproj (and its Package.resolved) is
    # gitignored, so a branch ref resolves to whatever commit happens to be at HEAD on
    # each checkout/CI run instead of a shared, reproducible one. Upgrading later is a
    # deliberate change (see ledger #130/#115; moved forward to origin/main tip in #132).
    revision: 75e590e770f7f01d088ced2546deed9817b660ae
targets:
  Dobby:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Dobby
        # Shell/ is a build-time copy (scripts/copy-app-shell.sh), not source.
        excludes:
          - Shell
      # #151, the bundled app shell for a Pi-less cold start. A folder REFERENCE
      # (`type: folder`), not a group: Xcode's resource copy flattens a group, and the
      # shell's `js/…` and `playsvideo/assets/…` paths have to survive into the bundle —
      # `dobby-offline://shell/js/01-state-init.js` resolves against them verbatim
      # (OfflineSchemeHandler.fileURL). A group would put every file at the bundle root
      # and the shell would 404 its own scripts.
      - path: Dobby/Shell
        type: folder
      - Shared
    dependencies:
      - package: KSPlayer
        product: KSPlayer
      # iOS-only: WidgetKit/ActivityKit Live Activities have no macOS counterpart.
      - target: DobbyWidgets
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.illegible.dobbyios
        PRODUCT_NAME: Dobby
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Dobby/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Dobby
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Dobby/Dobby.entitlements
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      # Refreshes Dobby/Shell from the sibling ../dobby checkout on every build, so the
      # bundled shell cannot go stale against the PWA it is a copy of. Android hangs the
      # same task off `preBuild` for the same reason (app/build.gradle:294).
      - path: scripts/copy-app-shell.sh
        name: Copy the PWA app shell
      - path: scripts/fix-bundle-ids.sh
        name: Fix framework bundle ids
      - path: scripts/deepen-macos-frameworks.sh
        name: Deepen macOS FFmpeg frameworks

  # Now Playing Live Activity. Exists for the CarPlay Dashboard, which renders Live
  # Activities without any CarPlay entitlement. iOS 26 floor: that is when
  # `supplementalActivityFamilies([.small])` — the API that puts our own view on the
  # dashboard instead of a Dynamic Island crop — shipped.
  DobbyWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "26.0"
    sources:
      - DobbyWidgets
      - Shared
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: eu.illegible.dobbyios.widgets
        PRODUCT_NAME: DobbyWidgets
        INFOPLIST_FILE: DobbyWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dobby
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
